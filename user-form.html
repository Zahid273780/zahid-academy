<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Entry Form - Zahid Academy</title>
  <link rel="stylesheet" href="user-form.css">
</head>
<body>

  <div class="top-bar">
    <a href="dashboard.html" class="back-btn">&#8592; Back to Dashboard</a>
  </div>

  <div class="card">
    <h1>User Entry Form</h1>
    <p class="lead">Fill in user details one by one. When done, export as CSV and import it into the Bulk Import page.</p>

    <div id="msg"></div>

    <div class="form-row">
      <div class="form-group">
        <label for="fRoll">Roll #</label>
        <input type="number" id="fRoll" placeholder="101" min="1">
      </div>
      <div class="form-group">
        <label for="fName">Full Name</label>
        <input type="text" id="fName" placeholder="Ali Khan" required>
      </div>
      <div class="form-group">
        <label for="fEmail">Email <span class="hint">(auto-filled)</span></label>
        <input type="email" id="fEmail" placeholder="ali@zahidacademy.com" required>
      </div>
      <div class="form-group">
        <label for="fPassword">Password <span class="hint">(auto-generated)</span></label>
        <div class="password-wrap">
          <input type="text" id="fPassword" placeholder="123456" required>
          <button type="button" class="gen-btn" id="genPwdBtn" title="Generate new password">GEN</button>
        </div>
      </div>
      <div class="form-group">
        <label for="fRole">Role</label>
        <select id="fRole">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
          <option value="accountant">Accountant</option>
        </select>
      </div>
      <div class="form-group">
        <label>&nbsp;</label>
        <button type="button" class="btn btn-add" id="addBtn">+ Add</button>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-export" id="exportBtn" disabled>Export CSV</button>
      <button type="button" class="btn btn-clear" id="clearBtn" disabled>Clear All</button>
      <span class="count" id="countLabel">0 entries</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>Roll</th><th>Name</th><th>Email</th><th>Password</th><th>Role</th><th></th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyMsg">No entries yet. Fill the form above and click <strong>+ Add</strong>.</div>
    </div>
  </div>

  <script type="module" src="user-form.js"></script>
</body>
</html>
