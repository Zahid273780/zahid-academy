<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscriptions - Shaeen Academy</title>
  <link rel="stylesheet" href="subscriptions.css">
</head>
<body>
  <div class="page">
    <p class="nav"><a href="dashboard.html" class="back-link">&#8592; Back to Dashboard</a></p>

    <div class="card">
      <h1>Student Subscriptions</h1>
      <p class="lead">Students can have <strong>multiple subscriptions</strong>. Each plan is tracked separately; MCQs are deducted from the first active plan (by priority, then expiry). Add or edit plans below.</p>
    </div>

    <div class="dash">
      <div class="dash-card blue">
        <div class="dash-label">Active</div>
        <div class="dash-val" id="statActive">--</div>
      </div>
      <div class="dash-card green">
        <div class="dash-label">With quota left</div>
        <div class="dash-val" id="statQuota">--</div>
      </div>
      <div class="dash-card amber">
        <div class="dash-label">Expired / Exhausted</div>
        <div class="dash-val" id="statExpired">--</div>
      </div>
      <div class="dash-card red">
        <div class="dash-label">Deactivated</div>
        <div class="dash-val" id="statOff">--</div>
      </div>
    </div>
    </div>
  <script type="module" src="subscriptions.js"></script>
</body>
</html>
