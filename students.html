<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Manage Subjects - Shaeen Academy</title>
  <link rel="stylesheet" href="subjects.css">
</head>
<body>
  <div class="page">
    <p class="nav">
      <a href="dashboard.html" class="back-link">&#8592; Back to Dashboard</a>
    </p>

    <div class="card">
      <h1>Manage Subjects</h1>
      <p class="lead">Add, edit and delete subjects for each class. These subjects appear in the Admission form.</p>

      <div class="form-row" id="addForm">
        <div>
          <label for="addClass">Class</label>
          <input type="number" id="addClass" placeholder="11" min="1" required>
        </div>
        <div>
          <label for="addSubject">Subject Name</label>
          <input type="text" id="addSubject" placeholder="e.g. Physics" required>
        </div>
        <div>
          <label for="addFee">Fee (Rs.)</label>
          <input type="number" id="addFee" placeholder="1200" min="0" required>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="button" class="btn btn-primary" id="addBtn">Add</button>
        </div>
      </div>
      <div id="msg"></div>
    </div>
    </div>
  <script type="module" src="subjects.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  }
</script></body>
</html>
