<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance - Zahid Academy</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="attendance.css">
</head>
<body>
  <div class="page">
    <p class="nav"><a href="dashboard.html">&#8592; Back to Dashboard</a></p>

    <div class="card">
      <h1><i class="fas fa-clipboard-check"></i> Attendance</h1>

      <div class="row">
        <div class="load-row">
          <div>
            <label>Date</label>
            <input type="date" id="attDate">
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="button" class="btn btn-primary" id="btnLoadAttendance"><i class="fas fa-sync-alt"></i> Load attendance</button>
          </div>
        </div>
        <div>
          <label>Class</label>
          <select id="selClass"><option value="">— Select class —</option></select>
        </div>
      </div>

      <div class="subject-toggles" id="subjectTogglesWrap">
        <span class="label">Subjects:</span>
        <div id="subjectChips" class="toggle-wrap">Select class first.</div>
      </div>

      <div id="markingSection" style="display: none;">
        <div class="roll-row">
          <div class="toggle-wrap">
            <span class="label">Mark as:</span>
            <button type="button" class="toggle-btn active" id="btnPresent" data-status="present">Present</button>
            <button type="button" class="toggle-btn" id="btnAbsent" data-status="absent">Absent</button>
            <button type="button" class="toggle-btn" id="btnHoliday" data-status="holiday">Holiday</button>
          </div>
          <label for="rollInput" class="roll-label">Enter roll</label>
          <input type="number" id="rollInput" placeholder="Roll number" min="1" step="1">
          <span id="rollName" class="roll-name" aria-live="polite"></span>
          <button type="button" class="btn btn-primary" id="btnMarkRoll"><i class="fas fa-check"></i> Mark</button>
        </div>
        <div class="actions-row">
          <button type="button" class="btn btn-success" id="btnMarkAllPresent"><i class="fas fa-user-check"></i> Mark all Present</button>
          <button type="button" class="btn btn-danger" id="btnMarkAllAbsent"><i class="fas fa-user-times"></i> Mark all Absent</button>
          <button type="button" class="btn btn-amber" id="btnMarkAllHoliday"><i class="fas fa-umbrella-beach"></i> Mark Holiday</button>
        </div>
        <div id="attMsg" class="msg"></div>

        <div id="attDashboard" class="att-dash" style="display: none;">
          <div class="att-dash-card present"><div class="att-dash-label">Present</div><div class="att-dash-val" id="dashPresent">0</div></div>
          <div class="att-dash-card absent"><div class="att-dash-label">Absent</div><div class="att-dash-val" id="dashAbsent">0</div></div>
          <div class="att-dash-card holiday"><div class="att-dash-label">Holiday</div><div class="att-dash-val" id="dashHoliday">0</div></div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr id="attHead">
                <th>Roll</th>
                <th>Name</th>
              </tr>
            </thead>
            <tbody id="attBody"></tbody>
          </table>
        </div>
        <div id="attEmpty" class="empty-msg" style="display:none;">No students enrolled in selected subjects for this class. Add subjects in Admission.</div>
      </div>
    </div>
  </div>

  <script type="module" src="attendance.js"></script>
</body>
</html>
