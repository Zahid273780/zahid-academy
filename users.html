<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Users - Zahid Academy</title>
  <link rel="stylesheet" href="users.css">
</head>
<body>
<script>window.addEventListener('error',function(e){if(e.filename&&e.filename.indexOf('share-modal')!==-1){e.preventDefault();e.stopPropagation();return true;}},true);</script>
  <div class="page">
    <p class="nav">
      <a href="dashboard.html" class="back-link">&#8592; Back to Dashboard</a>
    </p>

    <div class="card">
      <h1>Users</h1>
      <p class="lead">View, search and manage users. Admin only.</p>
      <div class="toolbar">
        <input type="text" id="search" class="search" placeholder="Search by name or email...">
        <select id="filterRole" class="filter-role">
          <option value="">All roles</option>
          <option value="admin">Admin</option>
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
          <option value="accountant">Accountant</option>
        </select>
        <button type="button" id="deleteSelected" class="btn-bulk-delete" disabled>Delete selected</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll"></th>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p id="empty" class="hidden">No users match your search.</p>
      <div id="msg"></div>
    </div>
  </div>

  <script type="module" src="users.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  }
</script></body>
</html>
