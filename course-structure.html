<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Course Structure - Zahid Academy</title>
  <link rel="stylesheet" href="course-structure.css">
</head>
<body>
<script>window.addEventListener('error',function(e){if(e.filename&&e.filename.indexOf('share-modal')!==-1){e.preventDefault();e.stopPropagation();return true;}},true);</script>
  <div class="page">
    <p class="nav">
      <a href="dashboard.html" class="back-link">&#8592; Back to Dashboard</a>
    </p>

    <div class="card">
      <h1>Course Structure</h1>
      <p class="lead">Add and edit course structure: Course, Class/Exam, Subject, Unit, Category, Topics, Test Number.</p>

      <h2 id="formTitle">Add new</h2>
      <form id="form">
        <div class="form-grid">
          <div>
            <label for="fieldCourse">Course *</label>
            <input type="text" id="fieldCourse" required placeholder="e.g. Math, Science">
          </div>
          <div>
            <label for="fieldClassExam">Class/Exam *</label>
            <input type="text" id="fieldClassExam" required placeholder="e.g. Class 5, Midterm">
          </div>
          <div>
            <label for="fieldSubject">Subject *</label>
            <input type="text" id="fieldSubject" required placeholder="e.g. Algebra">
          </div>
          <div>
            <label for="fieldUnit">Unit *</label>
            <input type="text" id="fieldUnit" required placeholder="e.g. Unit 1">
          </div>
          <div>
            <label for="fieldCategory">Category</label>
            <input type="text" id="fieldCategory" placeholder="e.g. MCQ, Theory">
          </div>
          <div>
            <label for="fieldTopics">Topics</label>
            <input type="text" id="fieldTopics" placeholder="e.g. Cell Biology, Mitosis">
          </div>
          <div>
            <label for="fieldTestNumber">Test Number</label>
            <input type="number" id="fieldTestNumber" placeholder="e.g. 1" min="0" step="1">
          </div>
          <div class="full">
            <button type="submit" class="btn btn-primary" id="submitBtn">Save</button>
            <button type="button" class="btn btn-ghost" id="cancelEdit">Cancel</button>
          </div>
        </div>
      </form>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>All course structures</h2>
      <div>
        <input type="text" id="tableSearch" placeholder="Search all columns..." aria-label="Search course structures">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Course</th>
              <th>Class/Exam</th>
              <th>Subject</th>
              <th>Unit</th>
              <th>Category</th>
              <th>Topics</th>
              <th>Test Number</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p id="empty" class="hidden muted">No course structures yet. Add one above.</p>
    </div>
  </div>

  <script type="module" src="course-structure.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  }
</script></body>
</html>
