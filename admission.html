<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahid Academy - Admission Management</title>
  <style>
    :root { 
      --primary: #2563eb; 
      --success: #16a34a; 
      --error: #dc2626;
      --bg: #f8fafc; 
      --text: #1e293b; 
    }
    
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: var(--bg); 
      color: var(--text); 
      margin: 0; 
      padding: 20px; 
    }

    .container { 
      max-width: 1000px; 
      margin: auto; 
      background: white; 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
    }

    h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }
    h2 { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 40px; }

    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
      gap: 20px; 
    }
    
    .full-width { grid-column: 1 / -1; }
    
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9em; }
    
    input, select, textarea { 
      width: 100%; 
      padding: 10px; 
      border: 1px solid #cbd5e1; 
      border-radius: 6px; 
      box-sizing: border-box; 
      font-size: 14px;
    }

    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }

    .roll-hint {
      font-size: 0.78em;
      color: #64748b;
      margin-top: 4px;
    }
    .roll-hint strong { color: var(--primary); }

    .subjects-section { 
      background: #f1f5f9; 
      padding: 15px; 
      border-radius: 8px; 
      min-height: 50px;
    }
    .subjects-section.loading { 
      display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.85em;
    }
    .subjects-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .subject-chip {
      display: flex; align-items: center; gap: 8px;
      background: white; border: 2px solid #e2e8f0; border-radius: 8px;
      padding: 8px 14px; cursor: pointer; transition: all 0.2s;
      user-select: none;
    }
    .subject-chip:hover { border-color: #cbd5e1; }
    .subject-chip.checked { border-color: var(--primary); background: #eff6ff; }
    .subject-chip input[type="checkbox"] { width: auto; height: 16px; cursor: pointer; margin: 0; }
    .subject-chip .sub-name { font-weight: 600; font-size: 0.9em; color: #334155; }
    .subject-chip .sub-fee { font-size: 0.78em; color: #64748b; }
    .no-subjects { color: #94a3b8; font-size: 0.85em; padding: 8px 0; }

    .fee-breakdown {
      margin-top: 10px; padding: 10px 14px; background: #dcfce7;
      border-radius: 6px; font-size: 0.85em; color: #166534; font-weight: 600;
      display: none;
    }

    button[type="submit"] { 
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 15px; 
      border-radius: 6px; 
      font-size: 16px; 
      font-weight: 700; 
      cursor: pointer; 
      width: 100%; 
      margin-top: 20px; 
      transition: opacity 0.2s;
    }

    button[type="submit"]:hover { opacity: 0.9; }

    #message { 
      margin-top: 20px; 
      text-align: center; 
      padding: 10px; 
      border-radius: 6px; 
      display: none; 
    }

    .table-wrapper { overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
    th { background-color: #f1f5f9; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    tr:hover { background-color: #f8fafc; }
    
    .status-active { color: #16a34a; font-weight: bold; }
    .status-inactive { color: #dc2626; font-weight: bold; }

    .nav { margin: 0 0 16px; font-size: 0.875rem; color: #475569; }
    .nav a { color: var(--primary); text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <script>window.addEventListener('error',function(e){if(e.filename&&e.filename.indexOf('share-modal')!==-1){e.preventDefault();e.stopPropagation();return true}},true);</script>

<div class="container">
  <p style="margin-bottom:1rem;">
    <a href="dashboard.html" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:0.9rem;">&#8592; Back to Dashboard</a>
  </p>
  <h1>Zahid Academy Admission Portal</h1>

  <form id="admissionForm">
    <div class="form-grid">
      <div>
        <label for="roll">Roll Number</label>
        <input type="number" id="roll" placeholder="Loading..." required>
        <div class="roll-hint" id="rollHint"></div>
      </div>
      <div>
        <label for="name">Student Name</label>
        <input type="text" id="name" required>
      </div>
      <div>
        <label for="father">Father Name</label>
        <input type="text" id="father" required>
      </div>

      <div>
        <label for="gender">Gender</label>
        <select id="gender">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <div>
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>
      </div>
      <div>
        <label for="class">Class</label>
        <input type="number" id="class" placeholder="e.g. 11" required>
      </div>

      <div>
        <label for="phone">Phone Number</label>
        <input type="text" id="phone">
      </div>
      <div>
        <label for="whatsapp">WhatsApp Number</label>
        <input type="text" id="whatsapp">
      </div>
      <div>
        <label for="fee">Monthly Fee (auto-calculated)</label>
        <input type="number" id="fee" required>
      </div>

      <div>
        <label for="admission_date">Admission Date</label>
        <input type="date" id="admission_date" required>
      </div>
      <div>
        <label for="status">Account Status</label>
        <select id="status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
          <option value="Pending">Pending</option>
        </select>
      </div>

      <div class="full-width">
        <label for="address">Postal Address</label>
        <textarea id="address" rows="2" placeholder="Street, City..."></textarea>
      </div>

      <div class="full-width">
        <label>Subject Enrollment <span id="classLabel" style="font-weight:400; color:#64748b; font-size:0.85em;"></span></label>
        <div class="subjects-section" id="subjectsSection">
          <div class="no-subjects">Select a class above to load subjects</div>
        </div>
        <div class="fee-breakdown" id="feeBreakdown"></div>
      </div>
    </div>

    <button type="submit" id="submitBtn">Register Student</button>
  </form>

  <div id="message"></div>

  <h2>Admitted Students List</h2>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Roll</th>
          <th>Student Name</th>
          <th>Date of Birth</th>
          <th>WhatsApp</th>
          <th>Class</th>
          <th>Subjects</th>
          <th>Fee</th>
          <th>Adm. Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="students-table-body"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { supabase, initAuthGuard } from './auth-guard.js';
  await initAuthGuard();

  const form = document.getElementById('admissionForm');
  const messageDiv = document.getElementById('message');
  const tableBody = document.getElementById('students-table-body');
  const rollInput = document.getElementById('roll');
  const rollHint = document.getElementById('rollHint');
  const classInput = document.getElementById('class');
  const subjectsSection = document.getElementById('subjectsSection');
  const feeInput = document.getElementById('fee');
  const feeBreakdown = document.getElementById('feeBreakdown');
  const classLabel = document.getElementById('classLabel');

  let classSubjects = [];
  let lastRoll = 0;

  // --- Auto-fill roll number ---
  async function loadLastRoll() {
    const { data, error } = await supabase
      .from('admission_form')
      .select('roll')
      .order('roll', { ascending: false })
      .limit(1);

    if (!error && data && data.length > 0) {
      lastRoll = data[0].roll;
    } else {
      lastRoll = 0;
    }
    const nextRoll = lastRoll + 1;
    rollInput.value = nextRoll;
    rollInput.placeholder = 'e.g. ' + nextRoll;
    rollHint.innerHTML = 'Last roll: <strong>' + lastRoll + '</strong> — Next suggested: <strong>' + nextRoll + '</strong>';
  }

  // --- Load subjects from subjects table based on class ---
  let debounceTimer;
  classInput.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
      const cls = parseInt(classInput.value);
      if (cls && cls > 0) {
        loadSubjectsForClass(cls);
      } else {
        subjectsSection.innerHTML = '<div class="no-subjects">Select a class above to load subjects</div>';
        classLabel.textContent = '';
        classSubjects = [];
        recalcFee();
      }
    }, 300);
  });

  async function loadSubjectsForClass(cls) {
    subjectsSection.className = 'subjects-section loading';
    subjectsSection.innerHTML = 'Loading subjects for class ' + cls + '...';
    classLabel.textContent = '(Class ' + cls + ')';

    const { data, error } = await supabase
      .from('subjects')
      .select('*')
      .eq('class', cls)
      .order('subject', { ascending: true });

    subjectsSection.className = 'subjects-section';

    if (error) {
      subjectsSection.innerHTML = '<div class="no-subjects" style="color:#dc2626;">Error loading subjects</div>';
      classSubjects = [];
      return;
    }

    classSubjects = data || [];

    if (classSubjects.length === 0) {
      subjectsSection.innerHTML = '<div class="no-subjects">No subjects found for class ' + cls + '. <a href="subjects.html" style="color:var(--primary);">Add subjects</a></div>';
      recalcFee();
      return;
    }

    renderSubjectCheckboxes();
  }

  function renderSubjectCheckboxes() {
    var html = '<div class="subjects-grid">';
    classSubjects.forEach(function (s) {
      html += '<label class="subject-chip" data-id="' + s.id + '">'
        + '<input type="checkbox" value="' + s.id + '" data-fee="' + s.fee + '" data-name="' + s.subject + '">'
        + '<span class="sub-name">' + s.subject + '</span>'
        + '<span class="sub-fee">Rs. ' + s.fee + '</span>'
        + '</label>';
    });
    html += '</div>';
    subjectsSection.innerHTML = html;

    subjectsSection.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        cb.closest('.subject-chip').classList.toggle('checked', cb.checked);
        recalcFee();
      });
    });
  }

  function recalcFee() {
    var total = 0;
    var parts = [];
    subjectsSection.querySelectorAll('input[type="checkbox"]:checked').forEach(function (cb) {
      var fee = parseInt(cb.dataset.fee) || 0;
      total += fee;
      parts.push(cb.dataset.name + ' Rs.' + fee);
    });

    feeInput.value = total;

    if (parts.length > 0) {
      feeBreakdown.style.display = 'block';
      feeBreakdown.textContent = parts.join(' + ') + ' = Rs. ' + total;
    } else {
      feeBreakdown.style.display = 'none';
    }
  }

  function getSelectedSubjects() {
    var selected = [];
    subjectsSection.querySelectorAll('input[type="checkbox"]:checked').forEach(function (cb) {
      selected.push(cb.dataset.name);
    });
    return selected;
  }

  // --- Students table ---
  async function fetchStudents() {
    const { data, error } = await supabase
      .from('admission_form')
      .select('*')
      .order('roll', { ascending: true });

    if (error) { console.error('Error fetching:', error); return; }

    tableBody.innerHTML = '';
    data.forEach(function (s) {
      var subsList = [];
      if (s.physics) subsList.push('Phy');
      if (s.chemistry) subsList.push('Chem');
      if (s.biology) subsList.push('Bio');
      if (s.cs) subsList.push('CS');
      var subs = subsList.join(', ');

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + s.roll + '</td>'
        + '<td><strong>' + s.name + '</strong><br><small>' + s.father + '</small></td>'
        + '<td>' + (s.dob || '-') + '</td>'
        + '<td>' + (s.whatsapp || '-') + '</td>'
        + '<td>' + s.class + '</td>'
        + '<td>' + (subs || 'None') + '</td>'
        + '<td>Rs. ' + (s.fee || 0) + '</td>'
        + '<td>' + s.admission_date + '</td>'
        + '<td><span class="' + (s.status === 'Active' ? 'status-active' : 'status-inactive') + '">' + s.status + '</span></td>';
      tableBody.appendChild(tr);
    });
  }

  // --- Submit ---
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    
    messageDiv.style.display = 'block';
    messageDiv.style.background = '#e2e8f0';
    messageDiv.style.color = '#1e293b';
    messageDiv.textContent = 'Saving student record...';

    var selectedSubjects = getSelectedSubjects();
    var subsLower = selectedSubjects.map(function(s) { return s.toLowerCase(); });

    var payload = {
      roll: parseInt(rollInput.value),
      name: document.getElementById('name').value,
      father: document.getElementById('father').value,
      gender: document.getElementById('gender').value,
      dob: document.getElementById('dob').value || null,
      phone: document.getElementById('phone').value,
      whatsapp: document.getElementById('whatsapp').value,
      address: document.getElementById('address').value,
      class: parseInt(classInput.value) || null,
      physics: subsLower.indexOf('physics') !== -1,
      chemistry: subsLower.indexOf('chemistry') !== -1,
      biology: subsLower.indexOf('biology') !== -1,
      cs: subsLower.indexOf('cs') !== -1 || subsLower.indexOf('computer science') !== -1,
      admission_date: document.getElementById('admission_date').value,
      fee: parseInt(feeInput.value) || 0,
      status: document.getElementById('status').value
    };

    const { error } = await supabase
      .from('admission_form')
      .insert([payload]);

    if (error) {
      messageDiv.style.background = '#fee2e2';
      messageDiv.style.color = '#991b1b';
      messageDiv.textContent = 'Error: ' + error.message;
    } else {
      messageDiv.style.background = '#dcfce7';
      messageDiv.style.color = '#166534';
      messageDiv.textContent = 'Student Admitted Successfully!';
      form.reset();
      subjectsSection.innerHTML = '<div class="no-subjects">Select a class above to load subjects</div>';
      classLabel.textContent = '';
      feeBreakdown.style.display = 'none';
      classSubjects = [];
      await loadLastRoll();
      fetchStudents();
      setTimeout(function () { messageDiv.style.display = 'none'; }, 3000);
    }
  });

  // --- Init ---
  loadLastRoll();
  fetchStudents();
</script>
</body>
</html>
