<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Bulk Import MCQs - Shaheen Institute</title>
  <link rel="stylesheet" href="bulkimport.css">
</head>
<body>
<script>
  window.addEventListener('error', function (e) {
    if (e.filename && e.filename.indexOf('share-modal') !== -1) { e.preventDefault(); e.stopPropagation(); return true; }
    if (e.message && /addEventListener.*null/.test(e.message)) return true;
  }, true);
  window.onerror = function (msg) { if (msg && /addEventListener.*null/.test(String(msg))) return true; };
</script>
  <div class="page">
    <p class="nav"><a href="dashboard.html" class="back-link">&#8592; Back to Dashboard</a></p>

    <div class="card">
      <h1>Bulk Import MCQs</h1>
      <p class="lead">Select course structure, then paste MCQs or upload a .docx file.</p>

      <h2>1. Select course structure</h2>
      <p class="lead" id="structureLead">Loading structures…</p>
      <div class="form-grid cascade-grid">
        <div>
          <label for="selCourse">Course *</label>
          <select id="selCourse">
            <option value="">— Course —</option>
          </select>
        </div>
        <div>
          <label for="selClassExam">Class/Exam *</label>
          <select id="selClassExam" disabled>
            <option value="">— Class/Exam —</option>
          </select>
        </div>
        <div>
          <label for="selSubject">Subject *</label>
          <select id="selSubject" disabled>
            <option value="">— Subject —</option>
          </select>
        </div>
        <div>
          <label for="selUnit">Unit *</label>
          <select id="selUnit" disabled>
            <option value="">— Unit —</option>
          </select>
        </div>
        <div>
          <label for="selCategory">Category</label>
          <select id="selCategory" disabled>
            <option value="">— Category —</option>
          </select>
        </div>
        <div id="topicsRow" class="full" style="display:none;">
          <label for="inputTopics">Topics <span style="font-weight:400;color:#64748b;">(optional — e.g. "Cell Biology, Mitosis")</span></label>
          <input type="text" id="inputTopics" placeholder="Enter topics covered in this test…" style="width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:0.9rem;font-family:inherit;transition:border-color 0.2s;" />
        </div>
        <div id="testNumRow" class="full" style="display:none;">
          <label style="margin-bottom:8px;">Test # Assignment</label>
          <div style="display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 16px;border:2px solid #e2e8f0;border-radius:8px;font-weight:600;font-size:0.85rem;background:#fff;transition:all 0.15s;" id="labelManualMode">
              <input type="radio" name="testMode" id="radioManual" value="manual" checked style="accent-color:#2563eb;">
              <span>Manual — pick one test</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 16px;border:2px solid #e2e8f0;border-radius:8px;font-weight:600;font-size:0.85rem;background:#fff;transition:all 0.15s;" id="labelAutoMode">
              <input type="radio" name="testMode" id="radioAuto" value="auto" style="accent-color:#16a34a;">
              <span>Auto — sequential by custom batch size</span>
            </label>
          </div>
          <div id="manualTestRow" style="display:flex;align-items:center;gap:10px;">
            <select id="selTestNumber" disabled>
              <option value="">— Test # —</option>
            </select>
          </div>
          <div id="autoTestRow" style="display:none;align-items:center;gap:10px;">
            <label for="startTestNum" style="margin:0;white-space:nowrap;font-size:0.85rem;">Starting Test #</label>
            <input type="number" id="startTestNum" min="1" value="1" style="width:90px;padding:8px 10px;border:2px solid #e2e8f0;border-radius:8px;font-size:0.95rem;font-family:inherit;">
            <label for="batchSize" style="margin:0;white-space:nowrap;font-size:0.85rem;">MCQs per test</label>
            <input type="number" id="batchSize" min="1" value="20" style="width:100px;padding:8px 10px;border:2px solid #e2e8f0;border-radius:8px;font-size:0.95rem;font-family:inherit;">
            <span style="font-size:0.8rem;color:#64748b;" id="autoTestSummary"></span>
          </div>
        </div>
      </div>
      <p class="muted" id="mcqCountMsg" style="margin-top:0.5rem;"></p>

      <h2 style="margin-top:1.5rem;">2. Select test type</h2>
      <div style="display:flex;gap:12px;margin-bottom:1rem;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:12px 20px;border:2px solid #e2e8f0;border-radius:10px;font-weight:600;font-size:0.9rem;background:#fff;transition:all 0.15s;" id="labelPractice">
          <input type="radio" name="testType" id="typePractice" value="practice" checked style="accent-color:#2563eb;">
          <span>📖 Practice Test</span>
          <small style="font-weight:400;color:#64748b;display:block;">Visible in free practice mode</small>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:12px 20px;border:2px solid #e2e8f0;border-radius:10px;font-weight:600;font-size:0.9rem;background:#fff;transition:all 0.15s;" id="labelMock">
          <input type="radio" name="testType" id="typeMock" value="mock" style="accent-color:#dc2626;">
          <span>🎯 Mock Test</span>
          <small style="font-weight:400;color:#64748b;display:block;">Hidden — only in Give Test mode</small>
        </label>
      </div>

      <h2 style="margin-top:1.5rem;">3. Paste MCQs or upload .docx</h2>
      <form id="form">
        <div class="form-grid">
          <div class="full upload-row">
            <label for="docxFile">Upload .docx file</label>
            <input type="file" id="docxFile" accept=".docx" />
            <span id="docxName" class="muted"></span>
          </div>
          <div class="full">
            <label for="bulkText">Or paste MCQ text here</label>
            <textarea id="bulkText" placeholder="Paste your MCQs here…"></textarea>
          </div>
          <div class="full">
            <button type="submit" class="btn btn-primary" id="parseBtn" disabled>Parse &amp; preview</button>
          </div>
        </div>
      </form>
      <div id="msg"></div>

      <div id="reviewSection" class="hidden">
        <h2 style="margin-top:1.5rem;">4. Review, edit &amp; import</h2>
        <div class="review-toolbar" style="display:flex;flex-wrap:wrap;align-items:center;gap:0.5rem;">
          <button type="button" class="btn btn-ghost btn-sm" id="selectAllBtn">Select all</button>
          <button type="button" class="btn btn-ghost btn-sm" id="deselectAllBtn">Deselect all</button>
          <span class="muted" id="reviewCount"></span>
          <div style="margin-left:auto;display:flex;align-items:center;gap:0.75rem;">
            <div id="importTypeNotice" style="padding:8px 14px;border-radius:8px;font-size:0.85rem;font-weight:600;display:none;"></div>
            <button type="button" class="btn btn-primary" id="importSelectedBtn">Import selected</button>
          </div>
        </div>
        <div id="importMsg" style="margin-top:0.5rem;"></div>
        
        <div id="rangeButtonsContainer" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1.5rem; align-items:center;"></div>
        
        <div id="reviewList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="bulkimport.js?v=99"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  }
</script></body>
</html>
