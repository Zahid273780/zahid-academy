<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      function suppress(e) {
        var fn = (e && (e.filename || e.message));
        if (fn && String(fn).indexOf('share-modal') !== -1) return true;
        if (e && e.message && /addEventListener.*null/.test(e.message)) return true;
        return false;
      }
      window.addEventListener('error', function (e) {
        if (suppress(e)) { e.preventDefault(); e.stopPropagation(); return true; }
      }, true);
      window.onerror = function (msg, url) {
        if (url && String(url).indexOf('share-modal') !== -1) return true;
        if (msg && /addEventListener.*null/.test(String(msg))) return true;
        return false;
      };
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Create your account | Shaheen Institute</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="form.css">
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1>Create your account</h1>
      <p>Shaheen Institute – Student registration</p>
    </div>

    <div class="login-body">
      <img src="./assets/Logo.png" alt="Shaheen Institute Logo" class="form-logo">
      
      <div class="welcome-text">
        <h2>Register as a student</h2>
        <p>Enter your details</p>
      </div>

      <form id="requestForm" autocomplete="on">
        <div class="form-group">
          <label for="fullName">Full name</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input id="fullName" type="text" autocomplete="name" required placeholder="e.g. Ali Ahmed">
          </div>
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i class="fas fa-at"></i>
            <input id="username" type="text" required placeholder="Username" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label for="class">Class</label>
          <div class="input-wrapper">
            <i class="fas fa-school"></i>
            <input id="class" type="text" required placeholder="e.g. 9 or 10">
          </div>
        </div>
        <div class="form-group">
          <label for="whatsapp">WhatsApp number</label>
          <div class="input-wrapper">
            <i class="fab fa-whatsapp"></i>
            <input id="whatsapp" type="text" inputmode="tel" required maxlength="11" placeholder="03337502737" autocomplete="tel">
          </div>
          <p class="hint">Exactly 11 digits, e.g. 03337502737</p>
        </div>
        <div class="form-group">
          <label for="mobile">Mobile number</label>
          <div class="input-wrapper">
            <i class="fas fa-mobile-alt"></i>
            <input id="mobile" type="text" inputmode="tel" required maxlength="11" placeholder="03337502737" autocomplete="tel">
          </div>
          <p class="hint">Exactly 11 digits, e.g. 03337502737</p>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input id="password" type="password" required minlength="4" placeholder="Choose a password" autocomplete="new-password">
          </div>
          <p class="hint">Min 4 characters. You will use this on the Student Login page.</p>
        </div>
        <button type="submit" class="login-btn" id="submitBtn">
          <span id="btnText">Create account</span>
        </button>
      </form>

      <div id="formMsg" class="login-msg"></div>
    </div>

    <div class="login-footer">
      <a href="login.html">Already have an ID? Student Login</a>
    </div>
  </div>

  <script type="module" src="form.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  }
</script></body>
</html>
