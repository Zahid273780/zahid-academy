<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Test Publisher - Zahid Academy</title>
  <link rel="stylesheet" href="publisher.css">
</head>
<body>
  <div class="page">
    <p class="nav"><a href="dashboard.html" class="back-link">&#8592; Back to Dashboard</a>
    </p>

    <div class="card">
      <h1>Test Publisher</h1>
      <p class="lead">Publish or unpublish tests. Hidden tests are not visible to students. Publish them when ready for practice.</p>
    </div>

    <div class="dash">
      <div class="dash-card blue">
        <div class="dash-label">Total Tests</div>
        <div class="dash-val" id="statTotal">--</div>
        <div class="dash-sub">unique tests</div>
      </div>
      <div class="dash-card green">
        <div class="dash-label">Published</div>
        <div class="dash-val" id="statVisible">--</div>
        <div class="dash-sub">visible to students</div>
      </div>
      <div class="dash-card amber">
        <div class="dash-label">Hidden</div>
        <div class="dash-val" id="statHidden">--</div>
        <div class="dash-sub">not visible to students</div>
      </div>
    </div>

    <div class="card">
      <div class="cascade-grid" style="margin-bottom: 1rem;">
        <div>
          <label for="selCourse">Course</label>
          <select id="selCourse"><option value="">— All Courses —</option></select>
        </div>
        <div>
          <label for="selClassExam">Class/Exam</label>
          <select id="selClassExam" disabled><option value="">— All —</option></select>
        </div>
        <div>
          <label for="selSubject">Subject</label>
          <select id="selSubject" disabled><option value="">— All —</option></select>
        </div>
        <div>
          <label for="selUnit">Unit</label>
          <select id="selUnit" disabled><option value="">— All —</option></select>
        </div>
        <div>
          <label for="selCategory">Category</label>
          <select id="selCategory" disabled><option value="">— All —</option></select>
        </div>
      </div>

      <div class="view-toggle">
        <button id="viewAll" class="active">All</button>
        <button id="viewPublished">Published</button>
        <button id="viewHidden">Hidden</button>
      </div>

      <div id="msg"></div>
      <div id="testList"></div>
      <div id="emptyMsg" class="empty-msg" style="display:none;">No tests match your filters.</div>
    </div>
  </div>

  <script type="module" src="publisher.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  }
</script></body>
</html>
