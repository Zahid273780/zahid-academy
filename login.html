<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaeen Academy | Student Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
  <script>window.addEventListener('error',function(e){if(e.filename&&e.filename.indexOf('share-modal')!==-1){e.preventDefault();e.stopPropagation();return true}},true);</script>

<div class="login-card">
    <div class="login-header">
        <div class="logo-icon">
            <i class="fas fa-graduation-cap"></i>
        </div>
        <h1>Shaeen Academy</h1>
        <p>Student Examination Portal</p>
    </div>

    <div class="login-body">
        <div class="welcome-text">
            <h2>Welcome Back!</h2>
            <p>Enter your username and password to access tests</p>
        </div>

        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="email">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="email" placeholder="ali" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span id="btnText">Sign In</span>
            </button>
        </form>

        <div id="loginMsg" class="login-msg"></div>
    </div>

    <div class="login-footer">
        <div class="divider"><span>Need Help?</span></div>
        <div class="contact-info">
            <div class="academy-name"><i class="fas fa-school"></i> Shaeen Academy</div>
            <div class="contact-row">
                <i class="fas fa-phone"></i>
                <a href="tel:03337502737">0333-750-2737</a>
            </div>
            <div class="contact-row">
                <i class="fab fa-whatsapp"></i>
                <a href="https://wa.me/923337502737" target="_blank">WhatsApp: 0333-750-2737</a>
            </div>
            <div class="contact-row">
                <i class="fas fa-info-circle"></i>
                <span>Contact your teacher if you forgot your password</span>
            </div>
        </div>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>
